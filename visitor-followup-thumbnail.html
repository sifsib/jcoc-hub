<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
  canvas { display: none; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" style="display:block;">
  <defs>
    <!-- Warm golden background gradient (church exterior, golden hour) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b5845a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#c49a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6340;stop-opacity:1" />
    </linearGradient>

    <!-- Sky gradient top -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c87a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c49a6e;stop-opacity:0" />
    </linearGradient>

    <!-- Dark green overlay gradient: stronger on left, lighter on far right -->
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A5C38;stop-opacity:0.88" />
      <stop offset="55%" style="stop-color:#1A5C38;stop-opacity:0.78" />
      <stop offset="100%" style="stop-color:#1A5C38;stop-opacity:0.55" />
    </linearGradient>

    <!-- Warm light leak from top-right (lets background warmth breathe through) -->
    <radialGradient id="warmLeak" cx="80%" cy="10%" r="45%">
      <stop offset="0%" style="stop-color:#f5c97a;stop-opacity:0.28" />
      <stop offset="100%" style="stop-color:#f5c97a;stop-opacity:0" />
    </radialGradient>

    <!-- Phone screen shadow -->
    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Headline text shadow -->
    <filter id="textShadow" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Soft blur for background figures -->
    <filter id="bgBlur">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <!-- Logo glow -->
    <filter id="logoGlow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2E7D4F" flood-opacity="0.6"/>
    </filter>

    <!-- Checkbox checked mark clip -->
    <clipPath id="checkClip">
      <rect x="0" y="0" width="18" height="18" rx="3"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════
       LAYER 1: WARM BACKGROUND SCENE
  ═══════════════════════════════════════════ -->

  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="320" fill="url(#skyGrad)" opacity="0.6"/>

  <!-- Ground / stone path -->
  <rect x="0" y="560" width="1280" height="160" fill="#7a5c35" opacity="0.7"/>
  <rect x="0" y="555" width="1280" height="12" fill="#6b4f2a" opacity="0.5"/>

  <!-- Stone path texture lines -->
  <line x1="200" y1="560" x2="240" y2="720" stroke="#6b4f2a" stroke-width="1.5" opacity="0.4"/>
  <line x1="380" y1="560" x2="440" y2="720" stroke="#6b4f2a" stroke-width="1.5" opacity="0.4"/>
  <line x1="560" y1="560" x2="640" y2="720" stroke="#6b4f2a" stroke-width="1.5" opacity="0.4"/>
  <line x1="740" y1="560" x2="840" y2="720" stroke="#6b4f2a" stroke-width="1.5" opacity="0.4"/>
  <line x1="920" y1="560" x2="1040" y2="720" stroke="#6b4f2a" stroke-width="1.5" opacity="0.4"/>
  <line x1="1100" y1="560" x2="1240" y2="720" stroke="#6b4f2a" stroke-width="1.5" opacity="0.4"/>

  <!-- Church wall - right side -->
  <rect x="760" y="80" width="520" height="540" fill="#c4a882" opacity="0.85"/>
  <!-- Church stones texture -->
  <rect x="760" y="80" width="520" height="30" fill="#b89770" opacity="0.4"/>
  <rect x="760" y="150" width="520" height="28" fill="#b89770" opacity="0.35"/>
  <rect x="760" y="220" width="520" height="28" fill="#b89770" opacity="0.3"/>
  <rect x="760" y="290" width="520" height="28" fill="#b89770" opacity="0.35"/>
  <rect x="760" y="360" width="520" height="28" fill="#b89770" opacity="0.3"/>
  <rect x="760" y="430" width="520" height="28" fill="#b89770" opacity="0.35"/>
  <rect x="760" y="500" width="520" height="28" fill="#b89770" opacity="0.3"/>

  <!-- Church door - large wooden arch door -->
  <!-- Door arch outer -->
  <path d="M 870 560 L 870 280 Q 870 200 940 200 Q 1010 200 1010 280 L 1010 560 Z" fill="#3d2810" opacity="0.9"/>
  <!-- Door arch inner detail -->
  <path d="M 884 556 L 884 285 Q 884 218 940 218 Q 996 218 996 285 L 996 556 Z" fill="#4a3318" opacity="0.7"/>
  <!-- Door center line -->
  <line x1="940" y1="218" x2="940" y2="556" stroke="#3d2810" stroke-width="3" opacity="0.6"/>
  <!-- Door handle left -->
  <circle cx="928" cy="400" r="5" fill="#8a6e40" opacity="0.9"/>
  <!-- Door handle right -->
  <circle cx="952" cy="400" r="5" fill="#8a6e40" opacity="0.9"/>

  <!-- Church wall left side -->
  <rect x="0" y="80" width="400" height="540" fill="#c4a882" opacity="0.6"/>

  <!-- Trees / foliage background right -->
  <ellipse cx="1180" cy="220" rx="120" ry="160" fill="#5a8040" opacity="0.55"/>
  <ellipse cx="1240" cy="260" rx="90" ry="130" fill="#4a7030" opacity="0.5"/>
  <ellipse cx="1100" cy="250" rx="80" ry="110" fill="#6a9050" opacity="0.45"/>

  <!-- Foliage left -->
  <ellipse cx="60" cy="180" rx="100" ry="140" fill="#5a8040" opacity="0.5"/>
  <ellipse cx="120" cy="220" rx="80" ry="120" fill="#4a7030" opacity="0.45"/>

  <!-- ─── Blurred background PEOPLE (silhouettes, slightly warm) ─── -->
  <g filter="url(#bgBlur)" opacity="0.72">
    <!-- Group of people left, socialising -->
    <!-- Person 1 - woman in floral dress (center focal figure) -->
    <ellipse cx="620" cy="350" rx="35" ry="50" fill="#d4926a"/><!-- body/dress -->
    <circle cx="620" cy="290" r="28" fill="#c8825a"/><!-- head -->
    <ellipse cx="620" cy="400" rx="30" ry="60" fill="#e0a888"/><!-- dress lower -->
    <!-- arms open welcoming -->
    <ellipse cx="575" cy="355" rx="20" ry="10" fill="#c8825a" transform="rotate(-25 575 355)"/>
    <ellipse cx="665" cy="355" rx="20" ry="10" fill="#c8825a" transform="rotate(25 665 355)"/>

    <!-- Person 2 - man left background -->
    <ellipse cx="460" cy="370" rx="28" ry="45" fill="#7a8aaa"/>
    <circle cx="460" cy="320" r="24" fill="#c0906a"/>
    <ellipse cx="460" cy="415" rx="22" ry="50" fill="#5a6a8a"/>

    <!-- Person 3 - woman left -->
    <ellipse cx="510" cy="375" rx="24" ry="42" fill="#c4a0d0"/>
    <circle cx="510" cy="328" r="22" fill="#c8825a"/>
    <ellipse cx="510" cy="418" rx="20" ry="48" fill="#b090c0"/>

    <!-- Person 4 - man far left -->
    <ellipse cx="390" cy="380" rx="26" ry="44" fill="#c0b898"/>
    <circle cx="390" cy="330" r="23" fill="#b8785a"/>
    <ellipse cx="390" cy="424" rx="20" ry="46" fill="#a8a080"/>

    <!-- Person 5 - child -->
    <ellipse cx="555" cy="415" rx="18" ry="32" fill="#e8c898"/>
    <circle cx="555" cy="385" r="18" fill="#c8825a"/>

    <!-- Person 6 - man greeting right of door -->
    <ellipse cx="720" cy="365" rx="26" ry="44" fill="#9ab0c8"/>
    <circle cx="720" cy="316" r="23" fill="#b8785a"/>
    <ellipse cx="720" cy="410" rx="22" ry="48" fill="#8aa0b8"/>
  </g>

  <!-- Ground shadow under people -->
  <ellipse cx="560" cy="565" rx="200" ry="18" fill="#3d2810" opacity="0.25"/>

  <!-- Welcome table suggestion (right of door) -->
  <rect x="1040" y="440" width="120" height="10" fill="#7a5c35" opacity="0.7"/>
  <rect x="1045" y="450" width="8" height="90" fill="#6a4c25" opacity="0.7"/>
  <rect x="1147" y="450" width="8" height="90" fill="#6a4c25" opacity="0.7"/>

  <!-- Flowers on table -->
  <circle cx="1090" cy="425" r="12" fill="#f0d060" opacity="0.8"/>
  <circle cx="1105" cy="420" r="10" fill="#e8c8c0" opacity="0.8"/>
  <circle cx="1078" cy="422" r="9" fill="#9898d8" opacity="0.8"/>

  <!-- ═══════════════════════════════════════════
       LAYER 2: DARK GREEN BRAND OVERLAY
  ═══════════════════════════════════════════ -->
  <rect width="1280" height="720" fill="url(#overlayGrad)"/>
  <!-- Warm light leak from top-right corner to let warmth breathe through -->
  <rect width="1280" height="720" fill="url(#warmLeak)"/>

  <!-- ═══════════════════════════════════════════
       LAYER 3: PHONE MOCKUP (right side)
  ═══════════════════════════════════════════ -->
  <g transform="translate(750, 55)" filter="url(#phoneShadow)">
    <!-- Phone outer shell -->
    <rect x="0" y="0" width="320" height="610" rx="40" ry="40" fill="#1a1a2e"/>
    <!-- Phone frame highlight -->
    <rect x="3" y="3" width="314" height="604" rx="38" ry="38" fill="none" stroke="#3a3a5e" stroke-width="2" opacity="0.8"/>
    <!-- Screen area -->
    <rect x="10" y="14" width="300" height="582" rx="32" ry="32" fill="#f8f9fa"/>
    <!-- Notch -->
    <rect x="105" y="14" width="110" height="22" rx="11" ry="11" fill="#1a1a2e"/>
    <!-- Camera pill in notch -->
    <circle cx="172" cy="25" r="6" fill="#2a2a3e"/>
    <circle cx="172" cy="25" r="3" fill="#1a1a2e"/>

    <!-- ─── APP CONTENT INSIDE PHONE ─── -->

    <!-- App header bar - dark green -->
    <rect x="10" y="36" width="300" height="54" rx="0" fill="#1A5C38"/>
    <rect x="10" y="36" width="300" height="8" rx="0" fill="#1A5C38"/>

    <!-- Header: back arrow + title -->
    <text x="32" y="70" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.9">&#8592;</text>
    <text x="60" y="71" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white">Visitor Check-In</text>

    <!-- Status bar time -->
    <text x="24" y="50" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.85">9:41</text>
    <text x="262" y="50" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.85">●●●</text>

    <!-- Greeting card -->
    <rect x="20" y="102" width="280" height="58" rx="10" fill="#e8f5ee"/>
    <text x="36" y="124" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1A5C38">Welcome!</text>
    <text x="36" y="141" font-family="Arial, sans-serif" font-size="11" fill="#444">Please tell us a little about yourself</text>
    <text x="36" y="155" font-family="Arial, sans-serif" font-size="10" fill="#888">so we can follow up with you this week.</text>

    <!-- Section label -->
    <text x="24" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#555" letter-spacing="1">YOUR VISIT TODAY</text>
    <line x1="24" y1="187" x2="296" y2="187" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Question text -->
    <text x="24" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222">What brought you here today?</text>

    <!-- Option 1 - unselected -->
    <rect x="24" y="218" width="272" height="42" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="36" y="228" width="18" height="18" rx="4" fill="white" stroke="#ccc" stroke-width="1.5"/>
    <text x="64" y="243" font-family="Arial, sans-serif" font-size="12" fill="#444">Just visiting / curious</text>

    <!-- Option 2 - SELECTED (highlighted) -->
    <rect x="24" y="268" width="272" height="46" rx="8" fill="#e8f5ee" stroke="#2E7D4F" stroke-width="2"/>
    <!-- Checked checkbox -->
    <rect x="36" y="278" width="20" height="20" rx="4" fill="#1A5C38"/>
    <polyline points="39,288 43,293 55,281" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="291" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1A5C38">Looking to give my life to Christ</text>
    <text x="66" y="306" font-family="Arial, sans-serif" font-size="10" fill="#2E7D4F">I want to know more</text>

    <!-- Option 3 - unselected -->
    <rect x="24" y="322" width="272" height="42" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="36" y="332" width="18" height="18" rx="4" fill="white" stroke="#ccc" stroke-width="1.5"/>
    <text x="64" y="347" font-family="Arial, sans-serif" font-size="12" fill="#444">Reconnecting with faith</text>

    <!-- Option 4 - unselected -->
    <rect x="24" y="372" width="272" height="42" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="36" y="382" width="18" height="18" rx="4" fill="white" stroke="#ccc" stroke-width="1.5"/>
    <text x="64" y="397" font-family="Arial, sans-serif" font-size="12" fill="#444">Looking for a church home</text>

    <!-- Divider -->
    <line x1="24" y1="428" x2="296" y2="428" stroke="#ebebeb" stroke-width="1"/>

    <!-- Name field -->
    <text x="24" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#555">Your name</text>
    <rect x="24" y="458" width="272" height="38" rx="8" fill="white" stroke="#2E7D4F" stroke-width="1.8"/>
    <text x="36" y="482" font-family="Arial, sans-serif" font-size="12" fill="#888">Thandi Mokoena</text>

    <!-- Phone number field -->
    <text x="24" y="512" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#555">Phone number</text>
    <rect x="24" y="520" width="272" height="38" rx="8" fill="white" stroke="#ddd" stroke-width="1.5"/>
    <text x="36" y="544" font-family="Arial, sans-serif" font-size="12" fill="#bbb">+27 ...</text>

    <!-- Submit button -->
    <rect x="24" y="572" width="272" height="46" rx="10" fill="#1A5C38"/>
    <text x="160" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">Submit</text>

    <!-- Bottom bar indicator -->
    <rect x="110" y="625" width="100" height="4" rx="2" fill="#ccc" opacity="0.5"/>
  </g>

  <!-- ═══════════════════════════════════════════
       LAYER 4: HEADLINE TEXT
  ═══════════════════════════════════════════ -->

  <!-- Eyebrow text -->
  <text x="68" y="138"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="600"
        fill="#a8d8b8"
        letter-spacing="3"
        filter="url(#textShadow)">CHURCH VISITOR MANAGEMENT</text>

  <!-- Main headline - line 1 -->
  <text x="64" y="228"
        font-family="Arial Black, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="white"
        filter="url(#textShadow)">EVERY</text>

  <!-- Main headline - line 2 -->
  <text x="64" y="312"
        font-family="Arial Black, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="white"
        filter="url(#textShadow)">VISITOR</text>

  <!-- Main headline - line 3 (accent colour) -->
  <text x="64" y="396"
        font-family="Arial Black, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="#6dd89a"
        filter="url(#textShadow)">DESERVES</text>

  <!-- Main headline - line 4 -->
  <text x="64" y="480"
        font-family="Arial Black, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="white"
        filter="url(#textShadow)">A FOLLOW-UP.</text>

  <!-- Supporting subtext -->
  <text x="68" y="538"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="rgba(255,255,255,0.82)"
        letter-spacing="0.5"
        filter="url(#textShadow)">Capture. Connect. Disciple.</text>

  <!-- Decorative accent line under headline -->
  <rect x="64" y="548" width="80" height="4" rx="2" fill="#6dd89a" opacity="0.9"/>

  <!-- ═══════════════════════════════════════════
       LAYER 5: KEREKE HUB LOGO (bottom-left)
  ═══════════════════════════════════════════ -->
  <g transform="translate(56, 604)" filter="url(#logoGlow)">
    <!-- Logo icon: stylised leaf/cross mark -->
    <g transform="scale(0.85)">
      <!-- Outer rounded square -->
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#2E7D4F"/>
      <!-- Inner cross/leaf shape -->
      <path d="M 22 8 C 22 8 30 14 30 22 C 30 30 22 36 22 36 C 22 36 14 30 14 22 C 14 14 22 8 22 8 Z" fill="white" opacity="0.95"/>
      <!-- Horizontal bar -->
      <rect x="10" y="19" width="24" height="6" rx="3" fill="white" opacity="0.95"/>
    </g>

    <!-- Logo wordmark -->
    <text x="50" y="22"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20"
          font-weight="700"
          fill="white">Kereke</text>
    <text x="50" y="40"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20"
          font-weight="300"
          fill="#a8d8b8">Hub</text>
  </g>

  <!-- Subtle bottom gradient strip for logo area -->
  <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" style="stop-color:#000;stop-opacity:0"/>
    <stop offset="100%" style="stop-color:#000;stop-opacity:0.35"/>
  </linearGradient>
  <rect x="0" y="580" width="1280" height="140" fill="url(#bottomFade)"/>

  <!-- ═══════════════════════════════════════════
       LAYER 6: DECORATIVE DETAILS
  ═══════════════════════════════════════════ -->

  <!-- Top-left corner accent line -->
  <line x1="0" y1="0" x2="0" y2="720" stroke="#2E7D4F" stroke-width="6" opacity="0.7"/>

  <!-- Bottom right: kerekehub.co.za URL subtle -->
  <text x="1210" y="710"
        text-anchor="end"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        fill="rgba(255,255,255,0.45)"
        letter-spacing="0.5">kerekehub.co.za</text>

</svg>
</body>
</html>
