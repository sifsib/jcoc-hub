<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">

  <!-- Background -->
  <rect width="1280" height="720" fill="#EEF5EE"/>
  <circle cx="1160" cy="95" r="210" fill="#2E7D4F" opacity="0.055"/>
  <circle cx="90" cy="620" r="150" fill="#1A5C38" opacity="0.05"/>

  <!-- Form card -->
  <rect x="68" y="38" width="765" height="454" rx="14" fill="#00000018"/>
  <rect x="64" y="34" width="765" height="454" rx="14" fill="#FFFFFF"/>

  <!-- Form header -->
  <text x="102" y="82" font-size="23" font-weight="700" fill="#1C2B3A">New Member Registration</text>
  <text x="102" y="103" font-size="12.5" fill="#6B7280">A household record is created automatically. No signature required.</text>
  <line x1="64" y1="118" x2="829" y2="118" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Section 1 -->
  <circle cx="88" cy="139" r="13" fill="#3B82F6"/>
  <text x="88" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
  <text x="109" y="144" font-size="15" font-weight="700" fill="#2C3E50">Member Details</text>

  <!-- First Name -->
  <text x="102" y="174" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.9">FIRST NAME *</text>
  <rect x="102" y="180" width="268" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="118" y="203" font-size="14" fill="#374151" font-weight="500">Sipho</text>

  <!-- Last Name -->
  <text x="394" y="174" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.9">LAST NAME *</text>
  <rect x="394" y="180" width="268" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="410" y="203" font-size="14" fill="#374151" font-weight="500">Dlamini</text>

  <!-- Born Again (highlighted) -->
  <text x="102" y="236" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.9">BORN AGAIN? *</text>
  <rect x="102" y="242" width="268" height="36" rx="6" fill="#F0FBF4" stroke="#2E7D4F" stroke-width="2"/>
  <text x="118" y="265" font-size="14" fill="#1A5C38" font-weight="700">Yes</text>
  <text x="353" y="265" font-size="12" fill="#2E7D4F">&#9660;</text>

  <!-- Ministry Group (highlighted) -->
  <text x="394" y="236" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.9">MINISTRY GROUP</text>
  <rect x="394" y="242" width="268" height="36" rx="6" fill="#F0FBF4" stroke="#2E7D4F" stroke-width="2"/>
  <text x="410" y="265" font-size="13" fill="#1A5C38" font-weight="700">Worship Team</text>
  <text x="644" y="265" font-size="12" fill="#2E7D4F">&#9660;</text>

  <!-- Section 2 -->
  <line x1="80" y1="296" x2="822" y2="296" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="88" cy="316" r="13" fill="#3B82F6"/>
  <text x="88" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="white">2</text>
  <text x="109" y="321" font-size="15" font-weight="700" fill="#2C3E50">Faith &amp; Membership</text>

  <!-- Type of Membership -->
  <text x="102" y="350" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.9">TYPE OF MEMBERSHIP SOUGHT *</text>
  <rect x="102" y="356" width="558" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="118" y="379" font-size="13" fill="#9CA3AF">Select</text>
  <text x="644" y="379" font-size="12" fill="#9CA3AF">&#9660;</text>

  <!-- Family / Household -->
  <text x="102" y="408" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.9">FAMILY / HOUSEHOLD</text>
  <rect x="102" y="414" width="558" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="118" y="437" font-size="13" fill="#374151">Register spouse as member</text>

  <!-- Save button with layered glow -->
  <rect x="101" y="456" width="202" height="44" rx="8" fill="#22C55E" opacity="0.22"/>
  <rect x="102" y="452" width="200" height="44" rx="8" fill="#1A5C38"/>
  <text x="202" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="white">Save Member</text>

  <!-- Glowing cursor -->
  <circle cx="285" cy="468" r="28" fill="#4ADE80" opacity="0.16"/>
  <circle cx="285" cy="468" r="20" fill="#22C55E" opacity="0.22"/>
  <circle cx="285" cy="468" r="13" fill="#16A34A" opacity="0.3"/>
  <polygon points="273,452 273,478 280,471 284,483 290,481 285,469 295,469" fill="white"/>
  <polygon points="273,452 273,478 280,471 284,483 290,481 285,469 295,469" fill="none" stroke="#0F5C28" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Dark green strip -->
  <rect x="0" y="484" width="1280" height="236" fill="#1A5C38"/>
  <rect x="0" y="484" width="1280" height="4" fill="#22C55E" opacity="0.35"/>

  <!-- Headline -->
  <text x="90" y="572" font-size="68" font-weight="900" fill="#FFFFFF" letter-spacing="-2">YOUR ENTIRE CHURCH</text>
  <text x="90" y="655" font-size="68" font-weight="900" fill="#4ADE80" letter-spacing="-2">ONE FORM.</text>

  <!-- Family silhouette icon -->
  <circle cx="1100" cy="222" r="86" fill="#2E7D4F" opacity="0.18"/>
  <circle cx="1100" cy="222" r="78" fill="#2E7D4F"/>
  <circle cx="1100" cy="222" r="78" fill="none" stroke="white" stroke-width="3" opacity="0.18"/>
  <!-- Father -->
  <circle cx="1072" cy="182" r="14" fill="white" opacity="0.9"/>
  <path d="M1053,233 C1055,210 1091,210 1091,233 L1090,258 L1054,258 Z" fill="white" opacity="0.88"/>
  <!-- Mother -->
  <circle cx="1126" cy="185" r="12" fill="white" opacity="0.9"/>
  <path d="M1109,231 C1111,210 1143,210 1143,231 L1142,258 L1110,258 Z" fill="white" opacity="0.88"/>
  <!-- Child -->
  <circle cx="1099" cy="216" r="9" fill="white" opacity="0.9"/>
  <path d="M1086,248 C1088,232 1112,232 1112,248 L1111,258 L1087,258 Z" fill="white" opacity="0.88"/>
  <!-- Connecting arms -->
  <line x1="1091" y1="242" x2="1072" y2="242" stroke="white" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="1109" y1="242" x2="1126" y2="242" stroke="white" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

  <!-- Kereke Hub logo -->
  <rect x="1062" y="648" width="190" height="54" rx="10" fill="#0D3320"/>
  <text x="1081" y="684" font-size="24" font-weight="900" fill="#4ADE80">K</text>
  <text x="1108" y="674" font-size="14" font-weight="700" fill="white">Kereke</text>
  <text x="1108" y="692" font-size="13" font-weight="400" fill="#4ADE80">Hub</text>

</svg>
