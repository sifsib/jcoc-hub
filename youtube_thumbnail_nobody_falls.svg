<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="white" fill-opacity="0.85"/>
    </marker>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#2E7D4F" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#1A5C38"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <!-- Decorative accent circles -->
  <circle cx="1260" cy="-10" r="240" fill="#2E7D4F" fill-opacity="0.16"/>
  <circle cx="30" cy="750" r="180" fill="#2E7D4F" fill-opacity="0.1"/>
  <!-- Subtle accent strip -->
  <rect x="0" y="226" width="1280" height="1.5" fill="#2E7D4F" fill-opacity="0.45"/>

  <!-- HEADLINE -->
  <text x="640" y="112" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="white" text-anchor="middle" letter-spacing="-2">NOBODY FALLS</text>
  <text x="640" y="205" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="76" fill="#A8E6BF" text-anchor="middle" letter-spacing="-1">THROUGH THE CRACKS.</text>

  <!-- CARDS: 3 x 270px wide, 215px tall; 48px gaps; start x=187 -->

  <!-- CARD 1: Day 1 - Welcome Call -->
  <rect x="187" y="245" width="270" height="215" rx="14" fill="white"/>
  <!-- Top accent bar clipped via overlapping white mask trick: green rect + white bottom-round overlay -->
  <rect x="187" y="245" width="270" height="10" rx="0" fill="#1A5C38"/>
  <rect x="187" y="245" width="270" height="14" rx="14" fill="#1A5C38"/>
  <!-- Check circle -->
  <circle cx="322" cy="306" r="28" fill="#1A5C38"/>
  <!-- Checkmark -->
  <polyline points="309,306 319,317 337,292" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Labels -->
  <text x="322" y="362" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#2E7D4F" text-anchor="middle" letter-spacing="3">DAY 1</text>
  <text x="322" y="396" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="24" fill="#1A5C38" text-anchor="middle">Welcome</text>
  <text x="322" y="428" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="24" fill="#1A5C38" text-anchor="middle">Call</text>

  <!-- ARROW 1 -->
  <line x1="462" y1="352" x2="498" y2="352" stroke="white" stroke-width="3.5" stroke-opacity="0.85" marker-end="url(#arr)"/>

  <!-- CARD 2: Day 14 - Membership Class -->
  <rect x="505" y="245" width="270" height="215" rx="14" fill="white"/>
  <rect x="505" y="245" width="270" height="14" rx="14" fill="#1A5C38"/>
  <circle cx="640" cy="306" r="28" fill="#1A5C38"/>
  <polyline points="627,306 637,317 655,292" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="362" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#2E7D4F" text-anchor="middle" letter-spacing="3">DAY 14</text>
  <text x="640" y="396" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="24" fill="#1A5C38" text-anchor="middle">Membership</text>
  <text x="640" y="428" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="24" fill="#1A5C38" text-anchor="middle">Class</text>

  <!-- ARROW 2 -->
  <line x1="780" y1="352" x2="816" y2="352" stroke="white" stroke-width="3.5" stroke-opacity="0.85" marker-end="url(#arr)"/>

  <!-- CARD 3: Day 90 - Baptism -->
  <rect x="823" y="245" width="270" height="215" rx="14" fill="white"/>
  <rect x="823" y="245" width="270" height="14" rx="14" fill="#1A5C38"/>
  <circle cx="958" cy="306" r="28" fill="#1A5C38"/>
  <polyline points="945,306 955,317 973,292" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="958" y="362" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#2E7D4F" text-anchor="middle" letter-spacing="3">DAY 90</text>
  <text x="958" y="403" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="24" fill="#1A5C38" text-anchor="middle">Baptism</text>

  <!-- KEREKE HUB LOGO (bottom left) -->
  <!-- Logo mark: rounded rect with K letterform -->
  <rect x="52" y="534" width="48" height="48" rx="10" fill="#2E7D4F"/>
  <line x1="65" y1="543" x2="65" y2="573" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="65" y1="558" x2="79" y2="543" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="65" y1="558" x2="79" y2="573" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="110" y="554" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="22" fill="white">Kereke</text>
  <text x="111" y="577" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#A8E6BF" letter-spacing="4">HUB</text>

  <!-- Website URL bottom right -->
  <text x="1232" y="698" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A8E6BF" fill-opacity="0.6" text-anchor="end" letter-spacing="0.5">kerekehub.co.za</text>
</svg>
